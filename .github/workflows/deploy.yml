name: Deploy to smartstay.ba

on:
  push:
    branches:
      - master

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Deploy via cPanel API
        env:
          AUTH: "cpanel smartsta:${{ secrets.LEFTOR_API_TOKEN }}"
          CPANEL: https://cpanel.smartstay.ba
          ROOT: /home/smartsta/public_html
        run: |
          upload() {
            local file="$1"
            local sub
            sub=$(dirname "$file")
            local dir="$ROOT"
            [ "$sub" != "." ] && dir="$ROOT/$sub"
            echo "Uploading $file -> $dir"
            # Server vraća 429 kad ide prebrzo: pauza + ponovni pokušaj
            for attempt in 1 2 3 4 5; do
              resp=$(curl -s -X POST "$CPANEL/execute/Fileman/upload_files" \
                -H "Authorization: $AUTH" \
                -F "dir=$dir" \
                -F "overwrite=1" \
                -F "file-1=@$file")
              if echo "$resp" | grep -q '"succeeded":1'; then
                echo "  OK"
                sleep 2
                return 0
              fi
              echo "  attempt $attempt failed: $(echo "$resp" | head -c 200)"
              sleep $((attempt * 10))
            done
            echo "  FAILED: $file"
            FAILED=1
          }
          FAILED=0

          # Kreiraj podfoldere (greška "već postoji" je ok)
          mkdir_remote() {
            local parent="$1" name="$2"
            curl -s -G "$CPANEL/json-api/cpanel" \
              -H "Authorization: $AUTH" \
              --data-urlencode "cpanel_jsonapi_apiversion=2" \
              --data-urlencode "cpanel_jsonapi_module=Fileman" \
              --data-urlencode "cpanel_jsonapi_func=mkdir" \
              --data-urlencode "path=$parent" \
              --data-urlencode "name=$name" > /dev/null
          }
          for d in $(find resursi hoteli apartmani -type d | sort); do
            mkdir_remote "$ROOT/$(dirname "$d" | sed 's#^\.$##')" "$(basename "$d")"
          done

          for file in index.html hero-photo.jpg hero-photo.webp og-image.jpg demo.mp4 favicon.ico favicon-32.png apple-touch-icon.png logo.png robots.txt sitemap.xml; do
            [ -f "$file" ] && upload "$file"
          done
          for file in $(find resursi hoteli apartmani -type f \( -name '*.html' -o -name '*.css' -o -name '*.js' -o -name '*.webp' -o -name '*.svg' \) | sort); do
            upload "$file"
          done
          [ "$FAILED" = 1 ] && { echo "Some uploads failed"; exit 1; }
          echo "Deploy complete."
